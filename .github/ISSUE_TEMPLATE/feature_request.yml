name: 功能建议
description: 想要一个现在没有的查询或展示
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        本项目的硬约束是**事实要能查库**：能指到 `master.mdb` 的表或某个公开页面的字段，才做；
        查不到的，宁愿不做也不靠模型猜。所以下面「数据来源」这一栏请尽量写实。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在做什么事不方便 / 要翻几个地方
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的样子
      description: 界面上放哪、显示哪些字段、怎么筛选
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: 数据来源
      description: 例如 `master.mdb` 的 `skill_data` / BWiki 的某个页面（给链接与 revid）/ 完全拿不到
      placeholder: |
        master.mdb 表名 + 列名，或 BWiki 页面 URL + revid；拿不到就写「无来源」
    validations:
      required: true

  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 这个需求不需要注入客户端、读内存、抓包或自动化游戏操作
          required: true
        - label: 如果需要新的数据抓取，来源是公开页面，且可以限速与缓存
          required: true
