[project]
name = "uma-assistant"
version = "0.1.0"
description = "《闪耀！优俊少女》桌面助手：模块化、可增量开发"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.0",
    "pypdf>=5.1.0",
    "chromadb>=1.0.0",
    "sentence-transformers>=3.3.0",
    "openai>=1.55.0",
    "pywebview>=5.3.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false
# 缓存位于 C 盘、虚拟环境位于 D 盘，硬链接不可跨盘，统一走复制
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py313"
# data/ 是运行时目录（数据库、缓存、临时中转），不参与代码检查
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
